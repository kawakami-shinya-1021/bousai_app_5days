{% extends "base.html" %}

{% block content %}
<h2>避難所登録</h2>
<p>新しい避難所情報を登録します。</p>

{% if success %}
  <p>{{ message }}</p>
{% endif %}

<form method="POST">
  <p>
    <label for="name">避難所名（必須）</label><br>
    <input type="text" id="name" name="name">
  </p>
  {% if error %}
    <p class="error-message">{{ message }}</p>
  {% endif %}
  <p><button type="submit">登録</button></p>
</form>
{% endblock %}
