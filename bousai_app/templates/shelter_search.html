{% extends "base.html" %}

{% block content %}
<h2>避難所検索</h2>
<p>登録されている避難所を確認できます。</p>

<h3>避難所一覧</h3>
{% if shelters %}
	<ul>
		{% for shelter in shelters %}
		<li>{{ shelter.name }}</li>
		{% endfor %}
	</ul>
{% else %}
	<p>登録されている施設はありません。</p>
{% endif %}

<p><a href="/all_shelters">全施設一覧</a></p>
{% endblock %}
